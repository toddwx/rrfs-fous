name: Refresh and publish FOUS-style forecast

on:
  schedule:
    - cron: '15 3 * * *'
    - cron: '15 9 * * *'
    - cron: '15 15 * * *'
    - cron: '15 21 * * *'
    # A delayed catch-up gives GitHub another chance if it drops a scheduled event.
    - cron: '45 3 * * *'
    - cron: '45 9 * * *'
    - cron: '45 15 * * *'
    - cron: '45 21 * * *'
    # Retry missed RRFS refreshes throughout the day.
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      forecast_date:
        description: 'Optional UTC date, YYYYMMDD (blank uses the current cycle)'
        required: false
        type: string
      forecast_cycle:
        description: 'Optional UTC cycle for recovery'
        required: false
        type: choice
        options: [auto, '00', '06', '12', '18']
        default: auto
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'ops/**'
      - '.github/workflows/site.yml'

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FOUS_DATE: ${{ inputs.forecast_date || '' }}
  FOUS_CYCLE: ${{ inputs.forecast_cycle != 'auto' && inputs.forecast_cycle || '' }}

concurrency:
  group: fous-pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      refresh: ${{ steps.gate.outputs.refresh }}
    steps:
      - name: Check out the current forecast status
        uses: actions/checkout@v6
      - name: Check whether this cycle still needs an update
        id: gate
        run: python ops/should_refresh.py

  publish:
    concurrency:
      group: fous-page-publisher
      cancel-in-progress: false
    # Pushes publish page changes; scheduled and manual runs refresh RRFS data first.
    needs: check
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' &&
       contains(fromJSON('["15 3 * * *","15 9 * * *","15 15 * * *","15 21 * * *","45 3 * * *","45 9 * * *","45 15 * * *","45 21 * * *","17,47 * * * *"]'), github.event.schedule) &&
       needs.check.outputs.refresh == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the website and refresh scripts
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python for scheduled data refreshes
        if: github.event_name != 'push'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the GRIB reader
        if: github.event_name != 'push'
        run: python -m pip install -r ops/requirements.txt

      - name: Fetch the latest long-range RRFS cycle and rebuild the bulletin
        if: github.event_name != 'push'
        run: python ops/refresh_rrfs.py
        # RRFS files can lag the clock, especially around a new cycle. Keep
        # the last good bulletin and let the next half-hour catch-up retry.
        continue-on-error: true

      - name: Save the latest good forecast for the next run
        if: always() && github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/latest.txt site/data/source.json site/data/status.json site/data/stations.json
          if git diff --cached --quiet; then
            echo "No published data changed."
          else
            git commit -m "Save refreshed forecast data"
            # A code update can reach main while a scheduled refresh is still
            # running. Rebase the generated data commit onto the latest main
            # before pushing, retrying if another update lands in the meantime.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Could not safely rebase the refreshed data onto main."
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push raced with another update; retrying ($attempt/3)."
              sleep 2
            done
            echo "Could not publish refreshed data after three attempts."
            exit 1
          fi

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package the public website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
